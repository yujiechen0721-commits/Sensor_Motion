services:
  - type: web
    name: transport-recognition
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 只能用 1 個 worker：即時辨識的暫存資料放在記憶體裡，多個 worker 會對不上
    startCommand: gunicorn --chdir web app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
